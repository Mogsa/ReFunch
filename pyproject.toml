[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bench"
version = "0.1.0"
description = "A Python project using the BMAD Method"
readme = "README.md"
requires-python = ">=3.9"
authors = [
    {name = "Morgan"}
]
dependencies = [
    "pygame>=2.5.0",
    "numpy>=1.24.0",
    "matplotlib>=3.7.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = ["--verbose"]
